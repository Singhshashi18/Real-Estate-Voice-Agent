name: Daily Auto Commit

on:
  schedule:
    # Runs every single day at 12:00 PM UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to run it manually to test it

jobs:
  make-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Modify File
        run: |
          echo "Last updated on: $(date)" > daily_log.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add daily_log.txt
          git commit -m "docs: update log" || echo "No changes to commit"
          git push
