<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leads &amp; CRM — Karyan</title>
  <style>
    :root { --accent:#ff3c00; --bg:#030303; --card:#111; --text:#eee; --muted:#888; --line:#222; }
    * { box-sizing:border-box; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); margin:0; padding:2rem; }
    h1 { font-size:1.5rem; margin:0 0 .25rem; }
    h2 { font-size:1.05rem; }
    .sub { color:var(--muted); font-size:.9rem; margin:0 0 1rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1.25rem; margin:1rem 0; max-width:960px; }
    label { display:block; font-size:.8rem; color:var(--muted); margin:.5rem 0 .3rem; }
    input { width:100%; padding:.55rem; border-radius:8px; border:1px solid #333; background:#0a0a0a; color:var(--text); }
    .row { display:flex; gap:.75rem; flex-wrap:wrap; }
    .row > div { flex:1; min-width:150px; }
    button { font:inherit; background:var(--accent); color:#fff; border:none; padding:.55rem 1.1rem; border-radius:999px; cursor:pointer; font-weight:600; margin-top:.75rem; }
    button.secondary { background:transparent; border:1px solid #444; color:var(--text); }
    button.small { padding:.3rem .7rem; font-size:.8rem; margin:0; }
    table { width:100%; border-collapse:collapse; font-size:.85rem; margin-top:.5rem; }
    th,td { text-align:left; padding:.5rem; border-bottom:1px solid var(--line); }
    .pill { border-radius:999px; padding:.15rem .6rem; font-size:.72rem; }
    .new { background:#1e3a8a33; color:#93c5fd; }
    .calling { background:#ff3c0022; color:var(--accent); }
    .called { background:#14532d55; color:#86efac; }
    .failed { background:#7f1d1d55; color:#fca5a5; }
    .do_not_call { background:#3f3f46; color:#d4d4d8; }
    .ok { color:#4ade80; } .warn { color:#fbbf24; }
    pre { background:#0a0a0a; padding:1rem; border-radius:8px; overflow:auto; font-size:.78rem; }
    .status { color:var(--muted); font-size:.85rem; }
  </style>
</head>
<body>
  <h1>Leads &amp; CRM</h1>
  <p class="sub">Central lead store · HubSpot sync · auto-call new leads</p>

  <div class="card" id="login-card">
    <h2>Sign in</h2>
    <label>Email</label>
    <input type="email" id="email" />
    <label>Password</label>
    <input type="password" id="password" />
    <button onclick="login()">Login</button>
    <p class="status" id="login-msg"></p>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <p id="cfg" class="status"></p>
      <button onclick="syncHubspot()">Sync from HubSpot</button>
      <button class="secondary" onclick="loadLeads()">Refresh leads</button>
      <pre id="sync-out" style="display:none"></pre>
    </div>

    <div class="card">
      <h2>Add lead manually</h2>
      <div class="row">
        <div><label>Phone *</label><input id="m-phone" placeholder="+91..." /></div>
        <div><label>Name</label><input id="m-name" /></div>
        <div><label>Email</label><input id="m-email" /></div>
      </div>
      <div class="row">
        <div><label>Property ID</label><input id="m-property" placeholder="KR-101" /></div>
        <div><label>Budget</label><input id="m-budget" placeholder="50 lakh" /></div>
        <div><label>Area</label><input id="m-area" /></div>
      </div>
      <label>Notes</label>
      <input id="m-notes" />
      <button onclick="addLead()">Add lead</button>
    </div>

    <div class="card">
      <h2>Leads</h2>
      <div id="leads"></div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let token = localStorage.getItem("leads_token") || "";

    async function api(path, opts = {}) {
      const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
      if (token) headers.Authorization = `Bearer ${token}`;
      const res = await fetch(API + path, { ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.statusText);
      return data;
    }

    async function login() {
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        token = data.access_token;
        localStorage.setItem("leads_token", token);
        show();
      } catch (e) {
        document.getElementById("login-msg").textContent = e.message;
      }
    }

    function show() {
      document.getElementById("login-card").style.display = "none";
      document.getElementById("app").style.display = "block";
      loadStatus();
      loadLeads();
    }

    async function loadStatus() {
      const s = await api("/api/leads/status");
      const el = document.getElementById("cfg");
      const hub = s.hubspot_configured ? '<span class="ok">HubSpot connected</span>' : '<span class="warn">HubSpot not configured (set HUBSPOT_ACCESS_TOKEN)</span>';
      const out = s.outbound_configured ? '<span class="ok">outbound ready</span>' : '<span class="warn">outbound not configured</span>';
      el.innerHTML = `${hub} · ${out} · auto-call: ${s.auto_call_default}`;
    }

    async function syncHubspot() {
      const out = document.getElementById("sync-out");
      out.style.display = "block";
      out.textContent = "Syncing...";
      try {
        const data = await api("/api/leads/sync/hubspot", {
          method: "POST",
          body: JSON.stringify({ limit: 100 }),
        });
        out.textContent = `Fetched ${data.fetched}, new ${data.new_leads}, updated ${data.updated_leads}, calls started ${data.calls.filter(c=>c.called).length}`;
        loadLeads();
      } catch (e) {
        out.textContent = e.message;
      }
    }

    async function addLead() {
      try {
        await api("/api/leads", {
          method: "POST",
          body: JSON.stringify({
            phone: document.getElementById("m-phone").value,
            name: document.getElementById("m-name").value,
            email: document.getElementById("m-email").value,
            property_id: document.getElementById("m-property").value,
            budget: document.getElementById("m-budget").value,
            area: document.getElementById("m-area").value,
            notes: document.getElementById("m-notes").value,
          }),
        });
        document.getElementById("m-phone").value = "";
        loadLeads();
      } catch (e) { alert(e.message); }
    }

    async function callLead(id) {
      try { await api(`/api/leads/${id}/call`, { method: "POST" }); loadLeads(); }
      catch (e) { alert(e.message); }
    }
    async function dnc(id) {
      try { await api(`/api/leads/${id}/do-not-call`, { method: "POST" }); loadLeads(); }
      catch (e) { alert(e.message); }
    }
    async function del(id) {
      if (!confirm("Delete lead?")) return;
      try { await api(`/api/leads/${id}`, { method: "DELETE" }); loadLeads(); }
      catch (e) { alert(e.message); }
    }

    async function loadLeads() {
      const data = await api("/api/leads");
      const rows = data.leads.map(l => `
        <tr>
          <td>${l.name || "—"}</td>
          <td>${l.phone}</td>
          <td>${l.source}</td>
          <td><span class="pill ${l.status}">${l.status.replace(/_/g," ")}</span></td>
          <td>${l.area || ""} ${l.budget ? "· " + l.budget : ""}</td>
          <td>
            <button class="small" onclick="callLead('${l.id}')">Call</button>
            <button class="small secondary" onclick="dnc('${l.id}')">DNC</button>
            <button class="small secondary" onclick="del('${l.id}')">Del</button>
          </td>
        </tr>`).join("");
      document.getElementById("leads").innerHTML = data.leads.length
        ? `<table><thead><tr><th>Name</th><th>Phone</th><th>Source</th><th>Status</th><th>Detail</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
        : '<p class="status">No leads yet. Sync HubSpot or add one manually.</p>';
    }

    if (token) show();
  </script>
</body>
</html>
